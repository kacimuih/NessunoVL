<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">Tiga pilar K3LH</title>
  <desc id="d1">Keselamatan kerja, kesehatan kerja, dan lingkungan hidup bersama-sama membentuk K3LH.</desc>
  <rect width="720" height="380" rx="18" fill="#1e293b"/>
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">Tiga Pilar K3LH</text>
  <g>
    <rect x="30" y="64" width="200" height="226" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <g transform="translate(130,122)">
      <path d="M0 -30 L25 -20 V5 C25 21 11 31 0 36 C-11 31 -25 21 -25 5 V-20 Z" fill="#f59e0b"/>
      <path d="M3 -16 L-9 4 H-1 L-4 20 L10 -2 H2 Z" fill="#1e293b"/>
    </g>
    <text x="130" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#fbbf24">Keselamatan Kerja</text>
    <text x="130" y="216" text-anchor="middle" font-size="14" fill="#cbd5e1">Terhindar dari sengatan,</text>
    <text x="130" y="236" text-anchor="middle" font-size="14" fill="#cbd5e1">korsleting, dan kebakaran</text>
    <text x="130" y="256" text-anchor="middle" font-size="14" fill="#cbd5e1">saat bekerja.</text>
  </g>
  <g>
    <rect x="260" y="64" width="200" height="226" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <g transform="translate(360,122)">
      <path d="M0 26 C-34 4 -30 -26 -12 -26 C-5 -26 0 -20 0 -15 C0 -20 5 -26 12 -26 C30 -26 34 4 0 26 Z" fill="#10b981"/>
      <path d="M-14 -2 H-5 L-1 -10 L5 8 L9 -2 H16" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="360" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#34d399">Kesehatan Kerja</text>
    <text x="360" y="216" text-anchor="middle" font-size="14" fill="#cbd5e1">Terhindar dari gangguan</text>
    <text x="360" y="236" text-anchor="middle" font-size="14" fill="#cbd5e1">dan penyakit akibat kerja</text>
    <text x="360" y="256" text-anchor="middle" font-size="14" fill="#cbd5e1">(posisi kerja, debu, bising).</text>
  </g>
  <g>
    <rect x="490" y="64" width="200" height="226" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <g transform="translate(590,122)">
      <path d="M-24 22 C-30 -10 -4 -32 26 -30 C28 0 10 26 -24 22 Z" fill="#38bdf8"/>
      <path d="M-24 22 L8 -14" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
    <text x="590" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#7dd3fc">Lingkungan Hidup</text>
    <text x="590" y="216" text-anchor="middle" font-size="14" fill="#cbd5e1">Mengelola limbah kabel,</text>
    <text x="590" y="236" text-anchor="middle" font-size="14" fill="#cbd5e1">lampu, dan baterai agar</text>
    <text x="590" y="256" text-anchor="middle" font-size="14" fill="#cbd5e1">tidak mencemari.</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M130 292 V312 H590 V292"/><path d="M360 292 V312"/></g>
  <rect x="140" y="320" width="440" height="42" rx="12" fill="#f59e0b"/>
  <text x="360" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">K3LH: aman, sehat, ramah lingkungan</text>
</svg>
