<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" height="100%" role="img" aria-labelledby="t-sop d-sop" font-family="Arial, Helvetica, sans-serif">
  <title id="t-sop">Alur SOP Kerja Aman Kelistrikan</title>
  <desc id="d-sop">Tiga tahap SOP keselamatan kerja listrik: Sebelum bekerja (isolasi dan LOTO), Saat bekerja (praktik aman tanpa tegangan), dan Setelah bekerja (inspeksi dan normalisasi).</desc>

  <!-- Latar Belakang -->
  <rect width="720" height="300" rx="16" fill="#1e293b"/>

  <!-- Judul & Subjudul -->
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Alur Prosedur Operasional Standar (SOP) Keselamatan Kerja Listrik</text>
  <text x="360" y="49" text-anchor="middle" font-size="11.5" fill="#94a3b8">Pedoman K3 Listrik: Persiapan &amp; LOTO &bull; Praktik Kerja Aman &bull; Inspeksi &amp; Uji Coba</text>

  <!-- ==================== TAHAP 1: SEBELUM BEKERJA ==================== -->
  <g id="card-sebelum">
    <rect x="24" y="66" width="204" height="216" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <!-- Header Badge -->
    <rect x="36" y="76" width="180" height="24" rx="6" fill="rgba(59,130,246,0.18)" stroke="#3b82f6" stroke-width="1"/>
    <text x="126" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="0.5">1. SEBELUM BEKERJA</text>

    <!-- Ilustrasi: Gembok LOTO & Tag Out -->
    <g transform="translate(126, 126)">
      <!-- Shackle Gembok -->
      <path d="M-8 -6 V-16 A8 8 0 0 1 8 -16 V-6" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Body Gembok -->
      <rect x="-14" y="-6" width="28" height="22" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="1.2"/>
      <!-- Lubang Kunci -->
      <circle cx="0" cy="2" r="2.5" fill="#0f172a"/>
      <path d="M-1.2 2 L-2 7 H2 L1.2 2 Z" fill="#0f172a"/>
      <!-- Label Tag LOTO -->
      <g transform="translate(14, -12)">
        <path d="M0 0 L14 0 L18 6 L18 24 L0 24 Z" fill="#fef08a" stroke="#eab308" stroke-width="1"/>
        <circle cx="5" cy="5" r="1.8" fill="#0f172a"/>
        <line x1="2" y1="11" x2="15" y2="11" stroke="#dc2626" stroke-width="1.8"/>
        <line x1="2" y1="15" x2="13" y2="15" stroke="#475569" stroke-width="1"/>
        <line x1="2" y1="19" x2="11" y2="19" stroke="#475569" stroke-width="1"/>
      </g>
    </g>

    <!-- Butir Langkah -->
    <text x="38" y="162" font-size="11" fill="#e2e8f0">&bull; Izin instruktur/guru</text>
    <text x="38" y="180" font-size="11" fill="#e2e8f0">&bull; Kenakan APD lengkap</text>
    <text x="38" y="198" font-size="11" fill="#e2e8f0">&bull; MCB OFF &amp; pasang LOTO</text>
    <text x="38" y="216" font-size="11" fill="#e2e8f0">&bull; Uji tegangan nihil (0 V)</text>

    <!-- Footer Tag -->
    <rect x="36" y="244" width="180" height="24" rx="6" fill="rgba(59,130,246,0.12)"/>
    <text x="126" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#93c5fd">Isolasi Energi Total</text>
  </g>

  <!-- Panah Penghubung 1 -> 2 -->
  <g id="arrow-1-2">
    <path d="M234 174 H248 M242 168 L248 174 L242 180" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== TAHAP 2: SAAT BEKERJA ==================== -->
  <g id="card-saat">
    <rect x="258" y="66" width="204" height="216" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <!-- Header Badge -->
    <rect x="270" y="76" width="180" height="24" rx="6" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="1"/>
    <text x="360" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.5">2. SAAT BEKERJA</text>

    <!-- Ilustrasi: Perkakas Berisolasi 1000V & Simbol Aman -->
    <g transform="translate(360, 126)">
      <!-- Obeng Berisolasi -->
      <g transform="rotate(-35)">
        <!-- Batang Logam Obeng -->
        <rect x="-2" y="-24" width="4" height="18" fill="#cbd5e1"/>
        <path d="M-2 -24 L0 -28 L2 -24 Z" fill="#94a3b8"/>
        <!-- Selubung Isolasi Batang (Kuning) -->
        <rect x="-3" y="-16" width="6" height="12" rx="1" fill="#f59e0b"/>
        <!-- Pegangan Obeng (Merah Tebal Berulir) -->
        <rect x="-7" y="-4" width="14" height="28" rx="4" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
        <line x1="-5" y1="4" x2="5" y2="4" stroke="#fef08a" stroke-width="2"/>
        <line x1="-5" y1="12" x2="5" y2="12" stroke="#fef08a" stroke-width="2"/>
      </g>
      <!-- Perisai Perlindungan -->
      <g transform="translate(14, -6)">
        <path d="M0 -12 L10 -8 V2 C10 8 4 13 0 15 C-4 13 -10 8 -10 2 V-8 Z" fill="rgba(245,158,11,0.25)" stroke="#f59e0b" stroke-width="1.4"/>
        <path d="M-2 -5 L2 -1 L6 -7" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Butir Langkah -->
    <text x="272" y="162" font-size="11" fill="#e2e8f0">&bull; Area &amp; tangan kering</text>
    <text x="272" y="180" font-size="11" fill="#e2e8f0">&bull; Perkakas isolasi standar</text>
    <text x="272" y="198" font-size="11" fill="#e2e8f0">&bull; Rakit tanpa tegangan</text>
    <text x="272" y="216" font-size="11" fill="#e2e8f0">&bull; Cegah sentuh 2 konduktor</text>

    <!-- Footer Tag -->
    <rect x="270" y="244" width="180" height="24" rx="6" fill="rgba(245,158,11,0.12)"/>
    <text x="360" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fde68a">Praktik Kerja Aman</text>
  </g>

  <!-- Panah Penghubung 2 -> 3 -->
  <g id="arrow-2-3">
    <path d="M468 174 H482 M476 168 L482 174 L476 180" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== TAHAP 3: SETELAH BEKERJA ==================== -->
  <g id="card-setelah">
    <rect x="492" y="66" width="204" height="216" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <!-- Header Badge -->
    <rect x="504" y="76" width="180" height="24" rx="6" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1"/>
    <text x="594" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.5">3. SETELAH BEKERJA</text>

    <!-- Ilustrasi: Papan Checklist & Kunci Terbuka -->
    <g transform="translate(594, 126)">
      <!-- Papan Dada Checklist -->
      <rect x="-16" y="-16" width="24" height="30" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1.4"/>
      <rect x="-8" y="-19" width="8" height="5" rx="1.5" fill="#10b981"/>
      <!-- Tanda Centang Hijau -->
      <path d="M-11 -6 L-8 -3 L-3 -9" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="0" y1="-6" x2="5" y2="-6" stroke="#64748b" stroke-width="1.2"/>
      <path d="M-11 2 L-8 5 L-3 -1" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="0" y1="2" x2="5" y2="2" stroke="#64748b" stroke-width="1.2"/>
      <!-- Simbol Kunci Terbuka (Unlocked) -->
      <g transform="translate(14, 4)">
        <path d="M-5 -2 V-8 A5 5 0 0 1 5 -8" fill="none" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="-8" y="-2" width="14" height="12" rx="2.5" fill="#10b981"/>
      </g>
    </g>

    <!-- Butir Langkah -->
    <text x="506" y="162" font-size="11" fill="#e2e8f0">&bull; Rapikan alat &amp; serpihan</text>
    <text x="506" y="180" font-size="11" fill="#e2e8f0">&bull; Cek kerapian sambungan</text>
    <text x="506" y="198" font-size="11" fill="#e2e8f0">&bull; Minta periksa instruktur</text>
    <text x="506" y="216" font-size="11" fill="#e2e8f0">&bull; Lepas LOTO &amp; uji MCB</text>

    <!-- Footer Tag -->
    <rect x="504" y="244" width="180" height="24" rx="6" fill="rgba(16,185,129,0.12)"/>
    <text x="594" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a7f3d0">Inspeksi &amp; Normalisasi</text>
  </g>
</svg>