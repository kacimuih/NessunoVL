<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-apd d-apd" font-family="Arial, Helvetica, sans-serif">
  <title id="t-apd">Alat Pelindung Diri (APD) Wajib Kelistrikan</title>
  <desc id="d-apd">Empat APD wajib pada pekerjaan listrik: sarung tangan isolasi, sepatu safety, kacamata pelindung, dan helm pelindung.</desc>
  <rect width="720" height="380" rx="18" fill="#1e293b"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">Alat Pelindung Diri (APD) Wajib Kelistrikan</text>

  <!-- Panel 1: Sarung Tangan Isolasi -->
  <g id="panel-sarung-tangan">
    <rect x="24" y="54" width="328" height="132" rx="12" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
    <rect x="38" y="68" width="96" height="104" rx="10" fill="#1e293b"/>
    <!-- Ilustrasi Sarung Tangan Karet -->
    <g transform="translate(86, 120)">
      <path d="M-18 28 L-14 42 H14 L18 28 Z" fill="#c2410c" stroke="#ea580c" stroke-width="1.5"/>
      <rect x="-14" y="42" width="28" height="4" rx="2" fill="#9a3412"/>
      <path d="M-18 28 C-20 18 -22 6 -18 -6 C-24 -4 -30 2 -32 -4 C-34 -10 -26 -16 -16 -16 C-14 -16 -14 -20 -14 -32 C-14 -38 -6 -38 -6 -32 L-6 -18 L-2 -36 C-2 -42 6 -42 6 -36 L6 -18 L10 -34 C10 -40 18 -40 18 -34 L18 -18 L22 -26 C22 -31 29 -31 29 -26 C29 -16 26 12 18 28 Z" fill="#f97316" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-6 -18 L-6 0 M6 -18 L6 2 M18 -18 L17 -2" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-16 -8 C-14 -2 -14 6 -16 12" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M1 31 L-4 38 H0 L-2 44 L4 37 H0 Z" fill="#fde047"/>
    </g>
    <!-- Label & Deskripsi Fungsi -->
    <text x="148" y="86" font-size="16" font-weight="700" fill="#fdba74">Sarung Tangan Isolasi</text>
    <rect x="148" y="96" width="188" height="24" rx="5" fill="rgba(249,115,22,0.18)"/>
    <text x="156" y="113" font-size="12" font-weight="700" fill="#fb923c">Cegah sentuhan langsung</text>
    <text x="148" y="140" font-size="12.5" fill="#cbd5e1">Bahan karet isolasi khusus</text>
    <text x="148" y="158" font-size="12" fill="#94a3b8">Isolasi tangan saat bekerja</text>
  </g>

  <!-- Panel 2: Sepatu Safety -->
  <g id="panel-sepatu-safety">
    <rect x="368" y="54" width="328" height="132" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="382" y="68" width="96" height="104" rx="10" fill="#1e293b"/>
    <!-- Ilustrasi Sepatu Safety Bersol Tebal -->
    <g transform="translate(430, 118)">
      <path d="M-28 -28 C-28 -34 -14 -36 -6 -34 C-2 -32 4 -28 6 -24 L2 -4 C4 2 12 6 22 10 C32 14 36 22 34 28 H-30 C-34 16 -34 -12 -28 -28 Z" fill="#334155" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-28 -28 C-26 -33 -14 -35 -6 -33 C0 -31 6 -26 6 -22" stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M14 10 C24 13 36 18 34 28 H12 C10 20 12 14 14 10 Z" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
      <path d="M-10 -18 L-2 -16 M-12 -10 L-4 -8 M-14 -2 L-6 0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <rect x="-34" y="28" width="70" height="9" rx="3" fill="#10b981"/>
      <path d="M-30 37 H-26 V41 H-30 Z M-22 37 H-18 V41 H-22 Z M-14 37 H-10 V41 H-14 Z M-6 37 H-2 V41 H-6 Z M2 37 H6 V41 H2 Z M10 37 H14 V41 H10 Z M18 37 H22 V41 H18 Z M26 37 H30 V41 H26 Z" fill="#047857"/>
      <line x1="-32" y1="31" x2="34" y2="31" stroke="#34d399" stroke-width="1.5"/>
    </g>
    <!-- Label & Deskripsi Fungsi -->
    <text x="492" y="86" font-size="16" font-weight="700" fill="#6ee7b7">Sepatu Safety</text>
    <rect x="492" y="96" width="188" height="24" rx="5" fill="rgba(16,185,129,0.18)"/>
    <text x="500" y="113" font-size="12" font-weight="700" fill="#34d399">Isolasi tubuh dari tanah</text>
    <text x="492" y="140" font-size="12.5" fill="#cbd5e1">Sol karet tebal tanpa logam</text>
    <text x="492" y="158" font-size="12" fill="#94a3b8">Memutus aliran listrik ke bumi</text>
  </g>

  <!-- Panel 3: Kacamata Pelindung -->
  <g id="panel-kacamata">
    <rect x="24" y="198" width="328" height="132" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="38" y="212" width="96" height="104" rx="10" fill="#1e293b"/>
    <!-- Ilustrasi Kacamata Goggles -->
    <g transform="translate(86, 264)">
      <path d="M-40 -4 C-44 -12 -36 -24 0 -24 C36 -24 44 -12 40 -4" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="6 3"/>
      <path d="M-36 -12 C-38 6 -32 20 -18 20 C-6 20 -2 12 0 6 C2 12 6 20 18 20 C32 20 38 6 36 -12 C34 -20 18 -20 4 -16 C1 -15 -1 -15 -4 -16 C-18 -20 -34 -20 -36 -12 Z" fill="#0f172a" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-32 -10 C-34 4 -28 16 -18 16 C-8 16 -4 8 -2 2 C-4 -14 -18 -16 -32 -10 Z" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M32 -10 C34 4 28 16 18 16 C8 16 4 8 2 2 C4 -14 18 -16 32 -10 Z" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="-24" y1="-8" x2="-14" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
      <line x1="-18" y1="-8" x2="-12" y2="4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
      <line x1="12" y1="-8" x2="22" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
      <line x1="18" y1="-8" x2="24" y2="4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
      <circle cx="-34" cy="-2" r="1.5" fill="#38bdf8"/>
      <circle cx="-34" cy="4" r="1.5" fill="#38bdf8"/>
      <circle cx="34" cy="-2" r="1.5" fill="#38bdf8"/>
      <circle cx="34" cy="4" r="1.5" fill="#38bdf8"/>
    </g>
    <!-- Label & Deskripsi Fungsi -->
    <text x="148" y="230" font-size="16" font-weight="700" fill="#7dd3fc">Kacamata Pelindung</text>
    <rect x="148" y="240" width="188" height="24" rx="5" fill="rgba(56,189,248,0.18)"/>
    <text x="156" y="257" font-size="12" font-weight="700" fill="#38bdf8">Lindungi dari percikan</text>
    <text x="148" y="284" font-size="12.5" fill="#cbd5e1">Lensa perisai polikarbonat</text>
    <text x="148" y="302" font-size="12" fill="#94a3b8">Tahan percikan api &amp; serpihan</text>
  </g>

  <!-- Panel 4: Helm Pelindung -->
  <g id="panel-helm">
    <rect x="368" y="198" width="328" height="132" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="382" y="212" width="96" height="104" rx="10" fill="#1e293b"/>
    <!-- Ilustrasi Helm Proyek Hard Hat -->
    <g transform="translate(430, 264)">
      <path d="M-34 10 C-34 -16 -24 -36 0 -36 C24 -36 34 -16 34 10 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
      <path d="M-6 -36 C-6 -38 0 -40 0 -40 C0 -40 6 -38 6 -36 L8 10 H-8 Z" fill="#fbbf24"/>
      <path d="M-20 -24 C-14 -12 -12 0 -12 10 M20 -24 C14 -12 12 0 12 10" stroke="#d97706" stroke-width="1.5" fill="none"/>
      <path d="M-40 10 C-40 6 -32 6 -24 6 H24 C32 6 40 6 40 10 C36 15 22 16 0 16 C-22 16 -36 15 -40 10 Z" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
      <path d="M-28 15 C-18 20 18 20 28 15" stroke="#78350f" stroke-width="2.5" fill="none"/>
      <path d="M-22 -14 C-18 -26 -8 -32 0 -32" stroke="#fef08a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
    </g>
    <!-- Label & Deskripsi Fungsi -->
    <text x="492" y="230" font-size="16" font-weight="700" fill="#fde047">Helm Pelindung</text>
    <rect x="492" y="240" width="188" height="24" rx="5" fill="rgba(245,158,11,0.18)"/>
    <text x="500" y="257" font-size="12" font-weight="700" fill="#fbbf24">Lindungi dari benturan</text>
    <text x="492" y="284" font-size="12.5" fill="#cbd5e1">Bahan tempurung kokoh</text>
    <text x="492" y="302" font-size="12" fill="#94a3b8">Aman dari kabel &amp; benda jatuh</text>
  </g>

  <!-- Banner Bawah Ringkasan -->
  <rect x="24" y="342" width="672" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="360" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="#94a3b8">APD adalah perlindungan lapis terakhir — selalu pastikan kondisi baik sebelum bekerja</text>
</svg>